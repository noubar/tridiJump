<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tridiJump</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="popup">
    <main>
      <h1>tridiJump</h1>
      <p class="muted">Find your next 3D model.</p>
      <form id="search-form" action="../results/index.html" method="get" target="_blank" rel="noopener">
        <label for="query">Search models</label>
        <div class="search-row">
          <input id="query" name="q" type="search" required maxlength="200" placeholder="What would you like to print?" />
          <button type="submit">Search</button>
        </div>
        <label class="check" for="expanded"><input id="expanded" name="expanded" type="checkbox" value="1" aria-describedby="expanded-help" />Expanded Search</label>
        <p id="expanded-help" class="hint">Synonym expansion is not available yet.</p>
      </form>
      <p id="repository-count" class="muted">3 API repositories available · checking local configuration…</p>
      <nav aria-label="Extension pages">
        <a href="../settings/index.html" target="_blank" rel="noopener">Open settings</a>
      </nav>
    </main>
  </body>
</html>
